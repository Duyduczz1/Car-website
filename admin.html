<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — BMW Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- ── LOGIN ── -->
  <div id="loginOverlay">
    <div class="login-box">
      <div class="login-logo">B<span>M</span>W</div>
      <p class="login-sub">Admin Dashboard</p>
      <div class="login-field">
        <label>Tên đăng nhập</label>
        <input type="text" id="loginUser" placeholder="admin" autocomplete="username" />
      </div>
      <div class="login-field">
        <label>Mật khẩu</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="login-btn" id="loginBtn">Đăng nhập</button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- ── ADMIN PANEL ── -->
  <div id="adminPanel">
    <nav class="admin-nav">
      <div class="admin-nav-left">
        <a href="index.html" class="admin-brand">B<span>M</span>W</a>
        <span class="admin-badge">Admin Panel</span>
      </div>
      <div class="admin-nav-right">
        <a href="models.html" class="btn-view-site" target="_blank">Xem trang web ↗</a>
        <button class="btn-logout" id="logoutBtn">Đăng xuất</button>
      </div>
    </nav>

    <!-- Stats Bar -->
    <div class="admin-stats">
      <div class="ast">
        <div class="ast-num" id="statTotal">0</div>
        <div class="ast-label">Tổng số xe</div>
      </div>
      <div class="ast">
        <div class="ast-num" id="statElectric">0</div>
        <div class="ast-label">Xe điện</div>
      </div>
      <div class="ast">
        <div class="ast-num" id="statHybrid">0</div>
        <div class="ast-label">Xe Hybrid</div>
      </div>
      <div class="ast">
        <div class="ast-num" id="statGas">0</div>
        <div class="ast-label">Xe xăng</div>
      </div>
    </div>

    <div class="admin-content">

      <!-- ADD FORM -->
      <div class="form-section">
        <div class="form-section-title">➕ Thêm xe mới</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Tên xe *</label>
            <input type="text" id="f_name" placeholder="VD: BMW M3 Competition" />
          </div>
          <div class="form-group">
            <label>Loại nhiên liệu *</label>
            <select id="f_fuel">
              <option value="">-- Chọn loại --</option>
              <option value="Điện">Điện</option>
              <option value="Xăng">Xăng</option>
              <option value="Hybrid">Hybrid</option>
            </select>
          </div>
          <div class="form-group">
            <label>Phân khúc / Dòng</label>
            <input type="text" id="f_segment" placeholder="VD: Sedan, SUV, Coupe..." />
          </div>
          <div class="form-group">
            <label>Công suất (HP)</label>
            <input type="text" id="f_hp" placeholder="VD: 510" />
          </div>
          <div class="form-group">
            <label>Giá (VNĐ)</label>
            <input type="text" id="f_price" placeholder="VD: 3.500.000.000" />
          </div>
          <div class="form-group">
            <label>Thông tin 1</label>
            <input type="text" id="f_info1" placeholder="VD: Tăng tốc 0–100 km/h: 3.9s" />
          </div>
          <div class="form-group">
            <label>Thông tin 2</label>
            <input type="text" id="f_info2" placeholder="VD: Phạm vi: 520 km" />
          </div>
          <div class="form-group">
            <label>Ảnh xe (URL)</label>
            <input type="text" id="f_imgUrl" placeholder="VD: images/BMW-M3.png" />
          </div>
          <div class="form-group">
            <label>Hoặc tải ảnh lên</label>
            <div class="img-upload-wrap" id="uploadWrap">
              <input type="file" id="f_img" accept="image/*" />
              <span class="upload-icon">📷</span>
              <span class="upload-label">Chọn hoặc kéo thả ảnh</span>
              <img class="img-preview" id="imgPreview" alt="preview" />
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-add" id="addCarBtn">Thêm xe</button>
          <button class="btn-reset" id="resetFormBtn">Đặt lại</button>
          <span class="form-success" id="formSuccess">✓ Xe đã được thêm thành công!</span>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-section">
        <div class="table-header">
          <span class="table-title">Danh sách xe trong showroom</span>
          <input type="text" class="table-search" id="tableSearch" placeholder="Tìm kiếm xe..." />
        </div>
        <div id="tableBody"></div>
      </div>

    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>✏️ Chỉnh sửa xe</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <input type="hidden" id="e_id" />
      <div class="form-grid">
        <div class="form-group">
          <label>Tên xe *</label>
          <input type="text" id="e_name" />
        </div>
        <div class="form-group">
          <label>Loại nhiên liệu</label>
          <select id="e_fuel">
            <option value="Điện">Điện</option>
            <option value="Xăng">Xăng</option>
            <option value="Hybrid">Hybrid</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phân khúc</label>
          <input type="text" id="e_segment" />
        </div>
        <div class="form-group">
          <label>Công suất (HP)</label>
          <input type="text" id="e_hp" />
        </div>
        <div class="form-group">
          <label>Giá (VNĐ)</label>
          <input type="text" id="e_price" />
        </div>
        <div class="form-group">
          <label>Thông tin 1</label>
          <input type="text" id="e_info1" />
        </div>
        <div class="form-group">
          <label>Thông tin 2</label>
          <input type="text" id="e_info2" />
        </div>
        <div class="form-group">
          <label>URL ảnh</label>
          <input type="text" id="e_imgUrl" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-save" id="saveEditBtn">Lưu thay đổi</button>
        <button class="btn-cancel" id="cancelEditBtn">Hủy</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM DELETE MODAL -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-title">Xóa xe này?</div>
      <p class="confirm-msg" id="confirmMsg">Hành động này không thể hoàn tác.</p>
      <div class="confirm-btns">
        <button class="btn-confirm-del" id="confirmDelBtn">Xóa</button>
        <button class="btn-cancel" id="cancelDelBtn">Hủy</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <div class="toast-dot"></div>
    <span id="toastMsg"></span>
  </div>

  <script src="js/main.js"></script>
  <script>
    // ── AUTH ──
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'admin123';

    const loginOverlay = document.getElementById('loginOverlay');
    const adminPanel = document.getElementById('adminPanel');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    function checkSession() {
      if (sessionStorage.getItem('bmw_admin') === '1') showAdmin();
    }

    function showAdmin() {
      loginOverlay.style.display = 'none';
      adminPanel.style.display = 'block';
      refreshTable();
      updateStats();
    }

    loginBtn.addEventListener('click', doLogin);
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && loginOverlay.style.display !== 'none') doLogin();
    });

    function doLogin() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem('bmw_admin', '1');
        showAdmin();
      } else {
        loginError.textContent = 'Sai tên đăng nhập hoặc mật khẩu.';
        document.getElementById('loginPass').value = '';
      }
    }

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('bmw_admin');
      location.reload();
    });

    checkSession();

    // ── DATA (localStorage) ──
    const STORAGE_KEY = 'bmw_cars';

    function getCars() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveCars(cars) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cars));
    }

    // ── STATS ──
    function updateStats() {
      const cars = getCars();
      document.getElementById('statTotal').textContent = cars.length;
      document.getElementById('statElectric').textContent = cars.filter(c => c.fuel === 'Điện').length;
      document.getElementById('statHybrid').textContent = cars.filter(c => c.fuel === 'Hybrid').length;
      document.getElementById('statGas').textContent = cars.filter(c => c.fuel === 'Xăng').length;
    }

    // ── IMAGE PREVIEW ──
    document.getElementById('f_img').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const preview = document.getElementById('imgPreview');
        const icon = document.querySelector('#uploadWrap .upload-icon');
        const lbl = document.querySelector('#uploadWrap .upload-label');
        preview.src = e.target.result;
        preview.style.display = 'block';
        icon.style.display = 'none';
        lbl.style.display = 'none';
        document.getElementById('f_imgUrl').value = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ── ADD CAR ──
    document.getElementById('addCarBtn').addEventListener('click', () => {
      const name = document.getElementById('f_name').value.trim();
      const fuel = document.getElementById('f_fuel').value;
      if (!name || !fuel) { showToast('Vui lòng điền tên xe và loại nhiên liệu!', 'error'); return; }

      const cars = getCars();
      const newCar = {
        id: Date.now(),
        name,
        fuel,
        segment: document.getElementById('f_segment').value.trim(),
        hp: document.getElementById('f_hp').value.trim(),
        price: document.getElementById('f_price').value.trim(),
        info1: document.getElementById('f_info1').value.trim(),
        info2: document.getElementById('f_info2').value.trim(),
        img: document.getElementById('f_imgUrl').value.trim(),
        num: String(cars.length + 1).padStart(2, '0')
      };
      cars.push(newCar);
      saveCars(cars);
      resetForm();
      refreshTable();
      updateStats();
      showToast('✓ Đã thêm xe ' + name + ' thành công!', 'success');
    });

    document.getElementById('resetFormBtn').addEventListener('click', resetForm);

    function resetForm() {
      ['f_name', 'f_fuel', 'f_segment', 'f_hp', 'f_price', 'f_info1', 'f_info2', 'f_imgUrl'].forEach(id => {
        const el = document.getElementById(id);
        if (el.tagName === 'SELECT') el.selectedIndex = 0;
        else el.value = '';
      });
      const preview = document.getElementById('imgPreview');
      preview.style.display = 'none';
      document.querySelector('#uploadWrap .upload-icon').style.display = '';
      document.querySelector('#uploadWrap .upload-label').style.display = '';
      document.getElementById('f_img').value = '';
    }

    // ── TABLE ──
    let searchQuery = '';
    document.getElementById('tableSearch').addEventListener('input', function () {
      searchQuery = this.value.toLowerCase();
      refreshTable();
    });

    function refreshTable() {
      const cars = getCars().filter(c =>
        !searchQuery || c.name.toLowerCase().includes(searchQuery)
      );
      const tbody = document.getElementById('tableBody');
      if (!cars.length) {
        tbody.innerHTML = '<div class="empty-state">Chưa có xe nào. Hãy thêm xe đầu tiên!</div>';
        return;
      }
      tbody.innerHTML = `
        <table class="cars-table">
          <thead>
            <tr>
              <th>STT</th>
              <th>Ảnh</th>
              <th>Tên xe</th>
              <th>Nhiên liệu</th>
              <th>HP</th>
              <th>Giá</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            ${cars.map((c, i) => `
              <tr>
                <td style="color:var(--blue);font-family:'Orbitron',sans-serif;font-size:12px;">
                  ${String(i + 1).padStart(2, '0')}
                </td>
                <td>
                  ${c.img
          ? `<img src="${c.img}" class="car-thumb" alt="${c.name}" onerror="this.style.display='none'" />`
          : `<div class="car-thumb-placeholder">🚗</div>`}
                </td>
                <td>
                  <strong style="color:var(--white)">${c.name}</strong>
                  ${c.segment ? `<br><span style="font-size:11px;color:var(--silver)">${c.segment}</span>` : ''}
                </td>
                <td>
                  <span class="tag-pill ${c.fuel === 'Điện' ? 'electric' : ''}">${c.fuel || '—'}</span>
                </td>
                <td>${c.hp ? c.hp + ' HP' : '—'}</td>
                <td style="color:var(--gold);font-size:12px;">${c.price || '—'} VNĐ</td>
                <td>
                  <div class="action-btns">
                    <button class="btn-edit" onclick="openEdit(${c.id})">Sửa</button>
                    <button class="btn-delete" onclick="openConfirmDelete(${c.id}, '${c.name.replace(/'/g, "\\'")}')">Xóa</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    // ── EDIT ──
    function openEdit(id) {
      const cars = getCars();
      const car = cars.find(c => c.id === id);
      if (!car) return;
      document.getElementById('e_id').value = id;
      document.getElementById('e_name').value = car.name;
      document.getElementById('e_fuel').value = car.fuel;
      document.getElementById('e_segment').value = car.segment || '';
      document.getElementById('e_hp').value = car.hp || '';
      document.getElementById('e_price').value = car.price || '';
      document.getElementById('e_info1').value = car.info1 || '';
      document.getElementById('e_info2').value = car.info2 || '';
      document.getElementById('e_imgUrl').value = car.img || '';
      document.getElementById('editModal').classList.add('open');
    }

    document.getElementById('saveEditBtn').addEventListener('click', () => {
      const id = parseInt(document.getElementById('e_id').value);
      const cars = getCars();
      const idx = cars.findIndex(c => c.id === id);
      if (idx === -1) return;
      cars[idx] = {
        ...cars[idx],
        name: document.getElementById('e_name').value.trim(),
        fuel: document.getElementById('e_fuel').value,
        segment: document.getElementById('e_segment').value.trim(),
        hp: document.getElementById('e_hp').value.trim(),
        price: document.getElementById('e_price').value.trim(),
        info1: document.getElementById('e_info1').value.trim(),
        info2: document.getElementById('e_info2').value.trim(),
        img: document.getElementById('e_imgUrl').value.trim(),
      };
      saveCars(cars);
      closeModal();
      refreshTable();
      updateStats();
      showToast('✓ Đã cập nhật xe thành công!', 'success');
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('cancelEditBtn').addEventListener('click', closeModal);
    document.getElementById('editModal').addEventListener('click', e => {
      if (e.target === document.getElementById('editModal')) closeModal();
    });

    function closeModal() {
      document.getElementById('editModal').classList.remove('open');
    }

    // ── DELETE ──
    let pendingDeleteId = null;

    function openConfirmDelete(id, name) {
      pendingDeleteId = id;
      document.getElementById('confirmMsg').textContent = `Bạn muốn xóa xe "${name}"? Hành động này không thể hoàn tác.`;
      document.getElementById('confirmOverlay').classList.add('open');
    }

    document.getElementById('confirmDelBtn').addEventListener('click', () => {
      if (pendingDeleteId === null) return;
      const cars = getCars().filter(c => c.id !== pendingDeleteId);
      saveCars(cars);
      pendingDeleteId = null;
      document.getElementById('confirmOverlay').classList.remove('open');
      refreshTable();
      updateStats();
      showToast('Đã xóa xe.', 'success');
    });

    document.getElementById('cancelDelBtn').addEventListener('click', () => {
      pendingDeleteId = null;
      document.getElementById('confirmOverlay').classList.remove('open');
    });

    // ── TOAST ──
    let toastTimer;
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.className = 'toast ' + type;
      void toast.offsetWidth;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>

</html>
<style>
  /* ── LOGIN OVERLAY ── */
  #loginOverlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-box {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 52px 44px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .login-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 0.2em;
    margin-bottom: 6px;
  }

  .login-logo span {
    color: var(--blue);
  }

  .login-sub {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 40px;
  }

  .login-field {
    position: relative;
    margin-bottom: 16px;
    text-align: left;
  }

  .login-field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 8px;
  }

  .login-field input {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 12px 16px;
    color: var(--white);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    transition: border-color 0.3s;
    outline: none;
  }

  .login-field input:focus {
    border-color: var(--blue);
  }

  .login-btn {
    width: 100%;
    margin-top: 8px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 13px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .login-btn:hover {
    background: #3a82ff;
    box-shadow: 0 0 24px rgba(30, 111, 255, 0.4);
  }

  .login-error {
    margin-top: 14px;
    font-size: 13px;
    color: #ff4d4d;
    min-height: 18px;
  }

  /* ── ADMIN LAYOUT ── */
  #adminPanel {
    display: none;
  }

  .admin-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    height: 64px;
    background: rgba(5, 5, 7, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
  }

  .admin-nav-left {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .admin-brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 0.18em;
    text-decoration: none;
  }

  .admin-brand span {
    color: var(--blue);
  }

  .admin-badge {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--blue);
    background: rgba(30, 111, 255, 0.1);
    border: 1px solid rgba(30, 111, 255, 0.25);
    padding: 4px 10px;
    border-radius: 2px;
  }

  .admin-nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .btn-view-site {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--silver);
    text-decoration: none;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    border-radius: 3px;
    transition: color 0.3s, border-color 0.3s;
  }

  .btn-view-site:hover {
    color: var(--white);
    border-color: var(--blue);
  }

  .btn-logout {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ff4d4d;
    background: transparent;
    padding: 7px 16px;
    border: 1px solid rgba(255, 77, 77, 0.3);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .btn-logout:hover {
    background: rgba(255, 77, 77, 0.1);
  }

  /* ── STATS BAR ── */
  .admin-stats {
    margin-top: 64px;
    padding: 28px 48px;
    background: var(--dark);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0;
  }

  .ast {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    border-right: 1px solid var(--border);
  }

  .ast:last-child {
    border-right: none;
  }

  .ast-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--white);
  }

  .ast-num span {
    color: var(--blue);
    font-size: 20px;
  }

  .ast-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silver);
    margin-top: 4px;
  }

  /* ── MAIN CONTENT ── */
